{% macro user_avatar(user, size=40, class_name='') %}
    {% if user and user.avatar and user.avatar.startswith('default_') %}
        <img src="{{ url_for('static', filename='profile_pics/' + user.avatar) }}" 
             alt="{{ user.username }}" 
             class="rounded-full object-cover {{ class_name }}"
             style="width: {{ size }}px; height: {{ size }}px;">
    {% elif user and user.avatar %}
        <img src="{{ url_for('static', filename='profile_pics/' + user.avatar) }}" 
             alt="{{ user.username }}" 
             class="rounded-full object-cover {{ class_name }}"
             style="width: {{ size }}px; height: {{ size }}px;">
    {% else %}
        <div class="rounded-full flex items-center justify-center text-white font-bold {{ class_name }}"
             style="width: {{ size }}px; height: {{ size }}px; background: #1d9bf0; font-size: {{ size * 0.4 }}px;">
            {{ user.username[:2].upper() if user else 'U' }}
        </div>
    {% endif %}
{% endmacro %}
