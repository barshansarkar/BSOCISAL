{% extends "base.html" %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-[var(--bg-secondary)] rounded-2xl p-8 border border-[var(--border)]">
        <h2 class="text-2xl font-bold text-center mb-4">Secure Data Access</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="p-3 mb-4 rounded-lg bg-red-50 text-red-600 border border-red-200 text-center">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="pin" placeholder="Enter PIN" required
                   class="w-full bg-[var(--bg)] rounded-xl px-4 py-3 border border-[var(--border)] focus:border-[var(--blue)] focus:outline-none mb-4">
            <button type="submit" class="btn-blue w-full py-3">Unlock</button>
        </form>
    </div>
</div>
{% endblock %}
